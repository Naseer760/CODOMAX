
name: CODOMAX CI Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    name: Build CODOMAX Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: client
        run: npm install

      - name: Build Application
        working-directory: client
        run: npm run build

      - name: CI Success
        run: echo "CODOMAX frontend build completed successfully!"
